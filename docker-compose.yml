x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    SENTRY_ORG: ${SENTRY_ORG:-}
    SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-${RACESIDE_RELEASE_SHA:-}}
    RACESIDE_RELEASE_SHA: ${RACESIDE_RELEASE_SHA:-}

services:
  web:
    build: *app-build
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      LIVE_INTERNAL_ORIGIN: "http://live:3002"
    ports:
      - "3000:3000"
    volumes:
      - web-image-cache:/app/.next/cache/images
    restart: unless-stopped

  live:
    build: *app-build
    env_file:
      - .env
    environment:
      LIVE_HOST: "0.0.0.0"
      LIVE_PORT: "3002"
      LIVE_SPOOL_DIR: "/app/live-spool"
      LIVE_WEB_ORIGIN: "http://web:3000"
    command: ["node", "worker/live/server.mjs"]
    volumes:
      - live-spool:/app/live-spool
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  worker:
    build: *app-build
    env_file:
      - .env
    command: ["node", "worker/cli.mjs", "rss.fetch_all"]
    healthcheck:
      disable: true
    restart: "no"

  admin-job-runner:
    build: *app-build
    env_file:
      - .env
    command:
      - node
      - worker/cli-loop.mjs
      - --loop-idle-ms=15000
      - --loop-busy-ms=1000
      - --loop-max-backoff-ms=300000
      - --loop-command-timeout-ms=1800000
      - --loop-heartbeat-timeout-ms=45000
      - --loop-heartbeat-service=admin-job-runner
      - jobs.consume_queued
      - --limit
      - "3"
    healthcheck:
      disable: true
    restart: unless-stopped

  cron:
    build: *app-build
    env_file:
      - .env
    command:
      - node
      - worker/cli-loop.mjs
      - --loop-idle-ms=60000
      - --loop-busy-ms=60000
      - --loop-max-backoff-ms=600000
      - --loop-command-timeout-ms=120000
      - --loop-heartbeat-timeout-ms=45000
      - --loop-heartbeat-service=cron
      - jobs.enqueue_schedules
      - --limit
      - "20"
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  live-spool:
  web-image-cache:
